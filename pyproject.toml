[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Multi-agent AI Engineering Lab for verifiable scientific and engineering work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pint>=0.24",
]

[project.optional-dependencies]
cursor = ["cursor-sdk>=0.1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ai-lab = "ai_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# Live Cursor calls are opt-in: pytest -m cursor
addopts = "-m 'not cursor'"
markers = [
    "docker: requires Docker engine and the configured image (skipped if unavailable)",
    "cursor: live Cursor SDK call (needs CURSOR_API_KEY + pip install '.[cursor]')",
]
